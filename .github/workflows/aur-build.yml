name: DOPS AUR Builder

on:
  workflow_dispatch:
    inputs:
      package:
        description: "AUR package name"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DOPS
        uses: actions/checkout@v4

      - name: Build AUR package
        run: |
          PACKAGE="${{ inputs.package }}"

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package name is empty"
            exit 1
          fi

          echo "Building AUR package: $PACKAGE"

          docker pull archlinux:latest

          docker run --rm \
            -e "PACKAGE=$PACKAGE" \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -c '
              set -e

              echo "Package: $PACKAGE"

              pacman -Sy --noconfirm \
                base-devel \
                git \
                sudo

              useradd -m builder

              printf "builder ALL=(ALL) NOPASSWD: ALL\n" \
                > /etc/sudoers.d/builder

              chown -R builder:builder /workspace

              su - builder -c "
                set -e
                cd /workspace

                rm -rf aur-package

                git clone \
                  https://aur.archlinux.org/${PACKAGE}.git \
                  aur-package

                cd aur-package

                echo
                echo "=== PKGBUILD ==="
                head -80 PKGBUILD
                echo "================"

                makepkg \
                  --syncdeps \
                  --noconfirm
              "
            '

      - name: Find Arch package
        run: |
          echo "Built packages:"

          find . -type f \
            \( -name "*.pkg.tar.zst" -o -name "*.pkg.tar.xz" \) \
            -print
